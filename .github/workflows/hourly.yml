name: Hourly drama fetch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run automation pipeline
        working-directory: automation
        run: |
          npm install
          npm start
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_API_KEY_2: ${{ secrets.CARTESIA_API_KEY_2 }}
          CARTESIA_API_KEY_3: ${{ secrets.CARTESIA_API_KEY_3 }}
          CARTESIA_BACKUP_API_KEY: ${{ secrets.CARTESIA_BACKUP_API_KEY }}

      # The frontend is a static build queried from MongoDB at build time, so
      # new articles don't appear until it's rebuilt. Redeploying every run
      # (rather than only when new articles were added) keeps this simple —
      # wrangler only re-uploads assets that actually changed, so a no-op
      # hour is cheap.
      - name: Build and deploy frontend to Cloudflare
        working-directory: site
        run: |
          npm install
          npm run build
          npx wrangler deploy
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PUBLIC_TTS_API_URL: https://digitaldramaback.netlify.app/api/tts
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
